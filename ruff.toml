# Ruff settings for the Python files outside python/: the scripts and tests in
# spec/tools/, parity/, .github/scripts/ and fixtures/conformance/tools/. Ruff
# resolves its configuration by walking up from each file, so without this file
# those scripts would get ruff's defaults, which change between releases.
# Extending the package's settings holds every tree to one rule set.
extend = "python/pyproject.toml"
# The scripts under docs/ are part of the frozen design evidence and are not
# linted.
extend-exclude = ["docs"]
