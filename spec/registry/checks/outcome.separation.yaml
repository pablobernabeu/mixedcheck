id: outcome.separation
version: 1
title: Separation of a binary outcome by the fixed effects
tier: T2
summary: >-
  Tests by linear programming whether the fixed-effects columns separate the
  events from the non-events completely or quasi-completely, in which case the
  maximum-likelihood estimates of the fixed effects diverge (Albert & Anderson,
  1984), with random effects as without them. An all-0 or all-1 cell is
  neither necessary nor sufficient for separation, which depends only on the
  column space of the fixed effects, so the verdict does not change with the
  coding. The programs run in an external solver, lpSolve in R and HiGHS
  through scipy in Python, with the settings stated below. Each solution is
  verified in double arithmetic before the verdict is decided, so that both
  packages decide on the same verified quantities, and the range of each
  coefficient over the optimal face is reported, because different solvers
  can return different optimal vertices. The check relates the outcome to the
  predictors, so Stream B runs it only in its exploratory mode
  (02-decisions.md, Q2 and Q3).
reads: [declaration, formula, outcome, predictors]
fitted_model: false
sample: analysis
families: [bernoulli, binomial]
scope: model
availability:
  - reason: package_missing
    condition: In R, lpSolve is not installed. In Python, scipy provides the solver.
    packages:
      R: [lpSolve]
  - reason: declaration_missing
    condition: >-
      The family class is bernoulli, the outcome takes values other than 0 and
      1, as numbers or logical values, in the analysis sample, and the
      declaration gives no event level.
    pointer: /variables/{outcome}/event_level
statistics:
  columns:
    kind: count
    count_class: non_person
    internal_only: true
    definition: >-
      The number of fixed-effects columns of the analysis sample that the
      sequential rule keeps, the columns of the linear programs. Beside the
      kept columns of the design sample, it would show that the rows without
      an outcome emptied a cell of the predictors.
  events:
    kind: count
    count_class: person
    suppress_with: [non_events]
    definition: >-
      The number of observations, as verdict defines them, with s = 1: the
      rows with an event, and for the binomial family class the rows with k
      above 0.
  non_events:
    kind: count
    count_class: person
    suppress_with: [events]
    definition: >-
      The number of observations with s = -1: the rows without an event, and
      for the binomial family class the rows with k below n.
  both_classes:
    kind: boolean
    definition: Whether events and non_events are both above 0.
  verdict:
    kind: category
    values: [none, quasi, complete]
    definition: >-
      Let X be the fixed-effects columns of the analysis sample that the
      sequential rule keeps, each divided by its largest absolute value. Each
      row gives one observation with sign s = 1 when it is an event and s = -1
      otherwise. For the binomial family class, a row with k events of n
      trials gives an observation with s = 1 when k is above 0 and one with
      s = -1 when k is below n. The first linear program maximises the sum over
      observations of s x'b subject to s x'b >= 0 for every observation and
      -1 <= b_j <= 1 for every coefficient. The second maximises t subject to
      s x'b >= t for every observation, the same bounds on b and t <= 1. A
      program of bounds below adds g'b >= f, with g the sum over observations
      of s x and f a floor, to the constraints of the first, and maximises
      b_j or -b_j. In R, each program is solved with lpSolve::lp() with scale
      = 0, since the columns are already scaled, through its dual. For a
      program that maximises c'b, or t for the second, the dual minimises the
      sum over coefficients of w+_j + w-_j, minus f r for a program of bounds
      and plus z for the second, over y_i for each observation, w+_j, w-_j, r
      and z, all at least 0, subject to w+_j - w-_j - (sum over observations
      of y_i s x_ij) - r g_j = c_j for each coefficient, with c = 0 for the
      second, and, for the second, the sum of the y_i plus z = 1. b is the
      vector of the dual values of the constraints of the coefficients, which
      lp() returns with compute.sens = 1. The dual has one constraint for
      each coefficient, and one more for the second program, whatever the
      number of observations. When lp() reports no optimum for the dual, or
      its b is not verified, the program itself is solved, with b_j = b+_j -
      b-_j and 0 <= b+_j, b-_j <= 1 as the solver's variables, the upper
      bounds written as constraints. In Python, each program is solved with
      scipy.optimize.linprog() with method 'highs-ds' and the options
      primal_feasibility_tolerance and dual_feasibility_tolerance set to
      1e-9. A solution is verified when the solver reports an optimum and
      every u = s x'b, computed from the returned b in double arithmetic, is
      at least minus feasibility_tolerance. A verified solution with some u
      below minus residue_tolerance meets the constraints only within the
      feasibility tolerance, and a solver can reach a large optimum through
      such a violation on data that no b other than 0 separates in exact
      arithmetic, so the finding is then near_threshold, whichever program
      it solves. Values of u between minus residue_tolerance and 0 leave the
      finding clear. They are the rounding residues of the solver's
      arithmetic where the exact value is 0, or the violation that data whose
      events and non-events overlap by less than about residue_tolerance on
      the scaled columns allow, which the check then reports as separated.
      The verdict is complete
      when the verified margin of the second program is above
      separation_tolerance, quasi otherwise when the verified optimum of the
      first is above separation_tolerance, and none otherwise. When
      both_classes is false, the programs are not solved, and verdict,
      optimum, margin, bounds and columns_involved are absent. The verdict is
      also absent when either program has no verified solution.
  optimum:
    kind: real
    internal_only: true
    definition: >-
      v1, the sum over observations of u for the verified solution of the
      first program, summed exactly and rounded once, as ir.md (Centring)
      sums values. It is absent when the first program has no verified
      solution or is not solved. The two packages compare it within bound_tolerance relative to
      the larger of 1 and the two values (conventions.md, Comparison across
      languages).
  margin:
    kind: real
    internal_only: true
    definition: >-
      v2, the smaller of 1 and the smallest u for the verified solution of
      the second program, which is its optimal t and so does not depend on
      which optimal solution the solver returns when t reaches its bound of 1.
      It is absent when the second program has no verified solution or is not
      solved, and it is compared as optimum is.
  bounds:
    kind: reals
    internal_only: true
    definition: >-
      When verdict is quasi or complete, for each kept column in column order,
      the smallest and the largest value of b_j over the optimal face of the
      first program, the set of b that meets its constraints with a sum of
      s x'b of at least optimum minus separation_tolerance, each found by a
      linear program solved and verified as above, as the pairs (smallest,
      largest) laid out in one list. Both packages compare these values within
      bound_tolerance. It is absent otherwise, or when one of these programs
      has no verified solution.
  columns_involved:
    kind: names
    internal_only: true
    definition: >-
      The kept columns whose largest value in bounds is above
      involvement_tolerance or whose smallest value is below minus
      involvement_tolerance, in column order, absent when bounds is absent.
thresholds: {}
parameters:
  separation_tolerance:
    value: 0.000001
    proximity_factor: 10
    definition: >-
      The value above which the verified margin or optimum, computed on
      columns scaled to a largest absolute value of 1, indicates separation,
      so that complete means separation with a margin above it on the scaled
      columns. A finding is near_threshold when the margin or the optimum lies
      within the proximity factor of it (registry.md, Parameters).
    sources:
      - kind: convention
        citation: >-
          Set by this project for registry 0.1.0, well above the feasibility
          tolerances of lpSolve, 1e-10 by default, and of HiGHS as the check
          sets them, 1e-9.
  feasibility_tolerance:
    value: 0.0000001
    definition: >-
      The amount by which a value u of a returned solution may fall below 0
      and the solution still count as verified.
    sources:
      - kind: convention
        citation: >-
          Set by this project for registry 0.1.0. In a review of registry
          0.1.0, lpSolve with scale = 0 returned solutions whose smallest u
          lay near -1.3e-8 on data of 200 rows, and HiGHS with its default
          tolerance of 1e-7 accepted violations up to that tolerance, which
          made data that overlap in exact arithmetic quasi-separated. On 2,000
          rows that only b = 0 separates in exact arithmetic, with one event
          and one non-event a gap g apart around 0.5, lpSolve returned an
          optimum near 500 with smallest u = -g for g = 1e-8 and 1e-9, where
          HiGHS at 1e-9 returned b = 0, so a verified solution with some u
          below minus residue_tolerance makes the finding near_threshold.
  residue_tolerance:
    value: 0.00000000001
    definition: >-
      The amount by which a value u of a verified solution may fall below 0
      without making the finding near_threshold. A value of u computed in
      double arithmetic from a returned b can fall a little below 0 where its
      exact value is 0, which says nothing about the data, whereas a
      violation through which a solver reaches a large optimum on data that
      no b other than 0 separates is as large as the gap in the data, such as
      the values -1e-8 and -1e-9 of the review of feasibility_tolerance. Data
      whose gap on the scaled columns is below this value can therefore be
      reported as separated with the status clear.
    sources:
      - kind: convention
        citation: >-
          Set by this project for registry 0.1.0. In M2b-2, lpSolve with scale
          = 0 and the variables c_j = b_j + 1 returned, on the audit-corpus
          cases audits-outcome-028, 029 and 031, solutions whose smallest u
          lay between -3.4e-13 and 0 where the exact value is 0, and on
          overlapping data of 40 to 2,000 rows smallest values of u down to
          -5e-12. Through the dual, it left smallest values of u down to
          -2.6e-13 on the programs of 84 generated tables of 200 to 160,000
          observations, each less than half of this parameter in absolute
          value.
  involvement_tolerance:
    value: 0.00001
    proximity_factor: 10
    definition: >-
      The absolute value above which a bound of a coefficient over the optimal
      face involves its column in the separation. It is ten times
      separation_tolerance, so that bounds that the two packages compare
      within bound_tolerance name the same columns, and a finding is
      near_threshold when a bound lies within the proximity factor of it.
    sources:
      - kind: convention
        citation: Set by this project for registry 0.1.0.
  bound_tolerance:
    value: 0.000001
    definition: >-
      The difference within which the coefficient bounds from the two packages
      agree, and, relative to the larger of 1 and the two values, the optimum
      and the margin (02-decisions.md, Q2, and conventions.md, Comparison
      across languages).
    sources:
      - kind: decision
        citation: 02-decisions.md, Q2
decision:
  rules:
    - finding: consistent
      condition: events or non_events is 0.
      statistics: [events, non_events, both_classes]
      thresholds: []
      message: one_class
    - finding: consistent
      condition: verdict is absent.
      statistics: [verdict]
      thresholds: []
      message: no_solution
    - finding: consequential
      condition: verdict is complete.
      statistics: [verdict]
      thresholds: []
      message: complete
    - finding: consequential
      condition: verdict is quasi.
      statistics: [verdict]
      thresholds: []
      message: quasi
  otherwise:
    finding: consistent
    message: none
assessability:
  - value: not_assessable
    reason: prerequisite_unmet
    prerequisite: both_outcome_classes
    condition: both_classes is false.
  - value: not_assessable
    reason: prerequisite_unmet
    prerequisite: verified_solution
    condition: verdict is absent.
messages:
  one_class:
    template: >-
      The analysis sample holds only events or only non-events, so separation
      cannot be assessed.
    args: {}
  no_solution:
    template: >-
      The solver gave no verified optimum of the linear programs, so
      separation could not be assessed.
    args: {}
  complete:
    template: >-
      The fixed effects separate the events from the non-events completely,
      through {columns}, so the estimates of these coefficients diverge and
      their Wald statistics are unreliable.
    fallback: >-
      The fixed effects separate the events from the non-events completely, so
      the estimates of some coefficients diverge and their Wald statistics are
      unreliable.
    args:
      columns: {source: statistic, name: columns_involved}
  quasi:
    template: >-
      The fixed effects separate the events from the non-events
      quasi-completely, through {columns}, so the estimates of these
      coefficients diverge and their Wald statistics are unreliable.
    fallback: >-
      The fixed effects separate the events from the non-events
      quasi-completely, so the estimates of some coefficients diverge and
      their Wald statistics are unreliable.
    args:
      columns: {source: statistic, name: columns_involved}
  none:
    template: The fixed effects do not separate the events from the non-events.
    args: {}
remedies:
  - id: merge_levels
    description: >-
      Merge sparse levels or remove the interaction that creates the
      separation, if this was declared as a contingency before the outcome was
      seen.
    uses_outcome: false
    changes_estimand: true
    software: []
  - id: penalised_estimation
    description: >-
      Use penalised or Bayesian estimation with weakly informative priors on the
      fixed effects, and report likelihood-ratio tests or profile intervals for
      the affected terms rather than Wald tests.
    uses_outcome: false
    changes_estimand: false
    software: []
links:
  requires: [design.rank_deficiency]
  explained_by: [outcome.constant_clusters]
references:
  - kind: literature
    citation: >-
      Albert, A., & Anderson, J. A. (1984). On the existence of maximum
      likelihood estimates in logistic regression models. Biometrika, 71(1),
      1-10.
    doi: 10.1093/biomet/71.1.1
    full_text_read: false
  - kind: derivation
    citation: >-
      Albert and Anderson (1984) prove the result for logistic regression. In
      a model with random effects, the likelihood conditional on any value of
      the random effects increases monotonically along a separating direction
      of the fixed effects, and so does its integral over the random effects,
      so the estimates of the fixed effects diverge there too.
  - kind: literature
    citation: >-
      Konis, K. (2007). Linear programming algorithms for detecting separated
      data in binary logistic regression models [Doctoral thesis, University
      of Oxford]. Oxford University Research Archive.
    url: https://ora.ox.ac.uk/objects/uuid:8f9ee0d0-d78e-4101-9ab4-f9cbceed2a2a
    full_text_read: false
  - kind: decision
    citation: 02-decisions.md, Q2
catalogue: [L3-03, L3-04]
