id: identifiability.gram_rank
version: 1
title: Identifiability of the covariance parameters
tier: T0
summary: >-
  Tests whether the covariance parameters of the random part can be separated
  by the design, before any fit. For a Gaussian model whose covariance
  parameters enter the marginal covariance linearly, the parameters are
  identified under REML if and only if their REML-projected covariance bases
  and the projection itself are linearly independent, which the rank of their
  Gram matrix decides. The rank of Z is the wrong criterion. For other family
  classes, the check uses the unprojected bases on the latent scale without the
  residual, which gives a necessary condition only, so the verdict is then
  necessary_condition_met rather than identified (02-decisions.md, Q3). The
  space spanned by the eigenvectors of the vanishing eigenvalues names the
  parameters that the design confounds.
reads: [formula, grouping_factors, predictors]
fitted_model: false
sample: design
scope: model
applies_when: The IR has at least one random term.
availability:
  - reason: too_large
    condition: Z has more than max_z_columns columns.
    parameter: max_z_columns
  - reason: too_large
    condition: >-
      The random terms have more than max_parameters covariance parameters.
    parameter: max_parameters
statistics:
  parameters:
    kind: count
    count_class: non_person
    definition: >-
      The number of covariance parameters of the random terms, a variance for
      each column of a term and a covariance for each pair of columns of a term
      that estimates correlations, plus 1 for the residual variance when the
      family class is gaussian.
  rank:
    kind: count
    count_class: non_person
    definition: >-
      parameters minus the number of vanishing parameters minus the number of
      eigenvalues of C at or below rank_tolerance. For the gaussian family
      class, let X be the fixed-effects columns that the sequential rule keeps,
      P = I - X(X'X)^-1 X', Z the random-effects matrix of the IR on the design
      sample with each column of a random term, in every level, divided by its
      largest absolute value over the design sample unless it is 0 in every
      row, D the residual basis, which is I without weights and diag(m/w) for
      weights w with m the smallest weight, diag(1/w) divided by its largest
      element, and W = Z'PZ. For other family classes, W = Z'Z, and the
      residual and the weights are left out. The divisions keep the products
      below from overflowing or underflowing, and they change M to SMS for a
      diagonal matrix S with positive elements, which leaves C, the vanishing
      test and the verdict unchanged. Each covariance parameter k has a
      symmetric basis matrix A_k over the columns of Z: 1 at the diagonal
      position of the column in every level of the term's factor for a
      variance, and 1 at the two positions of the pair of columns in every
      level for a covariance. The Gram matrix M has M_kl = tr(A_k W A_l W) for
      covariance parameters, M_ks = tr(A_k Z'PDPZ) between a covariance
      parameter and the residual, and M_ss = tr(PDPD), which is n - rank(X)
      without weights, with n the number of rows of the design sample. With
      weights, let Q be an orthonormal basis of the span of X, H = QQ', d_r
      the diagonal elements of D, A the rows r with H_rr above 1/2 and B the
      others. M_ss, the sum of d_r d_s P_rs^2 over the pairs of rows, is the
      sum of d_r^2 (1 - 2 H_rr) over B, plus ||Q_B'D_B Q_B||^2, plus twice the
      sum of d_r d_s H_rs^2 over r in A and s in B, plus the sum of
      d_r d_s (PP)_rs^2 over r and s in A, with (PP)_rs the inner product of
      the rows r and s of P. M_ks adds over the blocks (x, y) of A_k and the levels L the sum
      of d_r (P z_yL)_r (P z_xL)_r over r in A and z_yL'D_B z_xL -
      z_yL'D_B H z_xL - z_yL'H D_B z_xL + z_yL'H D_B H z_xL, for D_B equal to
      D in the rows of B and 0 elsewhere. No sum then cancels the share of a
      row that P takes to 0, which holds the largest element of D when its
      weight is the smallest, as a row does that a factor of the fixed part
      isolates. For a level L of the factor of its term, A_kL is the part of
      A_k at the columns of Z in level L, so that A_k is the sum of the A_kL
      over the levels. The level ratio of a covariance parameter k in L is
      tr(A_kL W A_kL W) divided by tr(A_kL Z'Z A_kL Z'Z), the same element of
      its unprojected basis in L, for each level where the latter is not 0,
      and its cancellation ratio is M_kk divided by T_k, the sum of
      tr(A_kL W A_kL W) over the levels. A covariance parameter vanishes when
      no level gives it a level ratio, when its largest level ratio is at or
      below rank_tolerance, so that P takes its basis to 0 in every level, or
      when its cancellation ratio is at or below rank_tolerance, so that the
      parts of its basis in the levels cancel. The residual vanishes when n
      equals rank(X), since PDP = 0 exactly when P = 0 for D with a positive
      diagonal, whereas M_ss / tr(DD) falls with the spread of the weights
      alone. These ratios do not depend on the units of the columns. A level ratio
      compares a level with itself, so that a level whose column lies almost
      in the span of X does not hide another level whose column does not, as
      M_kk divided by tr(A_k Z'Z A_k Z'Z) does when the first level holds far
      more rows: for a random intercept beside a fixed intercept, with one
      level of one row and one of N - 1 rows, that quotient falls below 1e-10
      from N of about 2e5. C is M restricted to the other parameters and
      scaled to C_kl = M_kl / sqrt(M_kk M_ll). Its eigenvalues and
      eigenvectors are computed in one call of LAPACK's solver for symmetric
      matrices, through eigen(symmetric = TRUE) in R and numpy.linalg.eigh in
      Python, which differ in rounding, and confounded_parameters takes its
      eigenvectors from the same call.
  verdict:
    kind: category
    values: [identified, necessary_condition_met, not_identified]
    definition: >-
      not_identified when rank is below parameters, and otherwise identified
      for the gaussian family class and necessary_condition_met for the other
      family classes, for which the test covers a necessary condition only.
  smallest_eigenvalue:
    kind: real
    internal_only: true
    definition: >-
      The smallest eigenvalue of C, a scale-free index of how close the design
      comes to confounding parameters. It is a heuristic, absent when C is
      empty, which the verdict does not read. Its rounding error, from the
      sums of W, grows with the rows of the design sample and is relative to
      the norm of C, at least 1, rather than to the eigenvalue
      (conventions.md, Comparison across languages). It is computed from the
      level sizes of the factors and the rows of the design sample, so that
      for a random intercept beside a fixed part constant within its levels
      it gives back the rows and the level sizes that the privacy filter
      suppresses, and a shareable document never writes it.
  vanishing_parameters:
    kind: names
    definition: >-
      The vanishing parameters, which the fixed effects absorb, named as the
      IR names them (ir.md, Covariance parameters) in their IR order.
  confounded_parameters:
    kind: names
    definition: >-
      The parameters k of C with sqrt(d_k) at least null_loading times the
      largest sqrt(d_j), where d_k is the sum of v_ik squared over an
      orthonormal basis v_1, ..., v_r of the eigenvectors of C whose
      eigenvalues are at or below rank_tolerance, the diagonal of the
      projector onto their span, named as the IR names them in their IR order.
      The projector does not depend on the basis chosen, so that every
      confounded parameter is named however the eigenvalues at rounding level
      are ordered. The list is empty when no eigenvalue is at or below
      rank_tolerance.
thresholds: {}
parameters:
  rank_tolerance:
    value: 0.0000000001
    proximity_factor: 10
    definition: >-
      The relative tolerance t at or below which an eigenvalue of C and the
      largest level ratio and the cancellation ratio of a covariance parameter
      count as zero, the latter compared only for a parameter whose largest
      level ratio exceeds t. Each such value s has a bound b on its rounding
      error to first order, and a finding is near_threshold when
      t/f <= |s| <= t f for the proximity factor f, or when |s| lies within b
      of t (registry.md, Parameters). Let e = 2^-52 and, for the gaussian
      family class, p the number of kept columns of X, X_s those columns each
      divided by its largest absolute value, Q and R the factors of the QR
      decomposition of X_s, with its columns in the order of R, and
      eta = ||Q'Q - I||_F + p (ceil(log2(n)) + 1) e + (||X_s - QR||_F +
      (p + 2)(1 + sqrt(p)) e ||X_s||_F) / sigma, for sigma the smallest
      singular value of R, each computed, with the elements of Q'Q summed
      pairwise over the rows. eta bounds the 2-norm of QQ' minus the
      projector onto the span of X, by Wedin's theorem, and grows with the
      condition of X_s.
      Otherwise p = eta = 0. For a level L of a random term, let n_L be its
      rows, h_L the sum of the squares of the rows of Q in L, or 0, h the
      largest h_L over the levels of all random terms and alpha_L =
      e (n_L (1 + 2 sqrt(h_L h)) + (p + 2) h_L + 3) / 2. An element of W
      between columns i in L and j in L' lies within
      (alpha_L + alpha_L' + eta) sqrt(s_i s_j), for s_i the sum of the
      squares of column i. For columns c and d of the random terms over all
      levels, A_c is the root of the sum over the levels L of
      alpha_L^2 s_cL, for s_cL the sum of the squares of c in L, F_cd the
      computed root sum of squares of the elements of W between c and d,
      N_cd = A_c sqrt(s_d) + sqrt(s_c) A_d and G_cd = F_cd + N_cd +
      eta sqrt(s_c s_d). M_kl lies within B_kl, the sum over the blocks
      (x, y) of A_k and (u, v) of A_l of N_yu G_xv + G_yu N_xv +
      2 e (J + J' + 2) F_yu F_xv, for the numbers of levels J and J' of the
      two terms, plus 2 eta sqrt(X_k X_l), for X_k the sum of mu^2 below over
      the levels. The packages sum the products of two blocks in nested sums
      in which each product passes through at most 2 (J + J') additions. In
      a level L, let delta_L = 2 alpha_L + eta, omega_c the computed diagonal
      element of W of c in L, or 0 when it is negative, plus delta_L s_cL,
      and mu the sum over the blocks (x, y) of A_k of sqrt(omega_x s_yL).
      tr(A_kL W A_kL W) lies within 3 delta_L mu^2, a level ratio r with
      unprojected element u within delta_L (3 mu^2 / u + |r|), the largest
      level ratio within the largest of these, and T_k within V_k, the sum of
      3 delta_L mu^2 over the levels plus e J times the sum of the absolute
      values of the elements. The cancellation ratio c
      lies within (B_kk + |c| V_k) / (T_k - V_k), or Inf when T_k <= V_k.
      Without weights, M_ss = n - rank(X) is exact and M_ks lies within the
      sum over the blocks (x, y) of A_k of the sum over the levels of
      2 alpha_L sqrt(s_xL s_yL) plus (eta + e J) sqrt(s_x s_y). With weights,
      for epsilon = (1 + p) e + eta and delta = n (1 + p) e + eta, M_ks lies
      within 2 delta d_B times the sum over the blocks of sqrt(s_x s_y), for
      d_B the largest d_r over B, plus the sum over the rows r of A, the
      blocks and the levels of d_r ((|a_y| + g_y) g_x + |a_x| g_y +
      delta |a_y a_x|), for a_c = (P z_cL)_r and g_c = 2 delta sqrt(s_cL),
      and M_ss within delta M_ss plus 2 epsilon times the sum of d_r^2 over
      B, plus the sum of 2 d_r d_s (2 |H_rs| + epsilon) epsilon over r in A
      and s in B, plus the sum of d_r d_s (2 |(PP)_rs| + zeta) zeta over r
      and s in A, for zeta = epsilon sqrt(n) (sqrt((PP)_rr) +
      sqrt((PP)_ss)) + 2 n epsilon^2. Off its diagonal, C_kl lies within
      E_kl = (|M_kl| + B_kl) / sqrt((M_kk - B_kk)(M_ll - B_ll)) - |C_kl|, and
      every eigenvalue of C within the root sum of squares of E plus e times
      the largest eigenvalue, by Weyl's inequality, or Inf when some B_kk
      reaches M_kk.
    sources:
      - kind: convention
        citation: >-
          Set by this project for registry 0.1.0. Exactly confounded parameters
          give eigenvalues at the level of rounding error, near 1e-16, far
          below it.
  null_loading:
    value: 0.000001
    definition: >-
      The share of the largest square root of a diagonal element of the
      projector at or above which a parameter belongs to the confounded
      set.
    sources:
      - kind: convention
        citation: Set by this project for registry 0.1.0.
  max_z_columns:
    value: 5000
    definition: >-
      The largest number of columns of Z for which the check runs. With
      max_parameters, it bounds the time of the check, which grows with the
      square of the number of columns of Z times the square of the largest
      number of columns of a random term, and with the number of rows times
      the square of the number of random terms, which max_parameters bounds.
      The check holds W in blocks, the elements between a few of the levels
      of one random term and the columns of the terms after it at a time, so
      that its memory does not grow with the square of the number of columns
      of Z.
    sources:
      - kind: convention
        citation: Set by this project for registry 0.1.0.
  max_parameters:
    value: 500
    definition: >-
      The largest number of covariance parameters of the random terms, the
      residual variance left out, for which the check runs. A random term
      with 31 columns has 496.
    sources:
      - kind: convention
        citation: >-
          Set by this project for registry 0.1.0 with max_z_columns, so that
          the check takes seconds rather than minutes at both limits on a few
          thousand rows.
decision:
  rules:
    - finding: consequential
      condition: verdict is not_identified.
      statistics: [verdict]
      thresholds: []
      message: not_identified
    - finding: consistent
      condition: verdict is necessary_condition_met.
      statistics: [verdict]
      thresholds: []
      message: necessary_only
  otherwise:
    finding: consistent
    message: identified
assessability: []
messages:
  not_identified:
    template: >-
      The design does not identify the covariance parameters of the random
      part: the Gram matrix of their bases has rank {rank} for {parameters}.
      Parameters that the fixed effects absorb: {vanishing}. Parameters that
      cannot be separated from one another: {confounded}.
    args:
      rank: {source: statistic, name: rank}
      parameters: {source: statistic, name: parameters, noun: [parameter, parameters]}
      vanishing: {source: statistic, name: vanishing_parameters}
      confounded: {source: statistic, name: confounded_parameters}
  necessary_only:
    template: >-
      The covariance parameters have linearly independent bases on the latent
      scale ({parameters} in all), which is necessary for identification in
      this family but does not establish it.
    args:
      parameters: {source: statistic, name: parameters}
  identified:
    template: >-
      The design identifies every covariance parameter, the residual variance
      included ({parameters} in all).
    args:
      parameters: {source: statistic, name: parameters}
remedies:
  - id: simplify_random_part
    description: >-
      Remove or merge the random terms whose parameters are confounded, starting
      with those named, or change a coding that makes uncorrelated terms
      unidentified.
    uses_outcome: false
    changes_estimand: false
    software: []
links:
  requires: [design.rank_deficiency]
  explained_by:
    - identifiability.df_budget
    - identifiability.residual_confounding
    - structure.aliased_factors
    - structure.cluster_sizes
    - structure.within_between
references:
  - kind: decision
    citation: 02-decisions.md, Q3
  - kind: derivation
    citation: >-
      Review catalogue (docs/design/evidence/review-catalogue.md), L1-06, with
      the verifier's corrections: the bases are projected for Gaussian models
      and unprojected on the latent scale for other families, and the raw
      condition number is not scale-free.
catalogue: [L1-05, L1-06]
