id: structure.id_scope_evidence
version: 1
title: Evidence on the scope of repeated labels
tier: T0
summary: >-
  When labels of one grouping column occur with several labels of another and
  the declaration states no relation between the two units, the check reports
  outcome-free evidence on whether a repeated label denotes one unit or
  several: whether attributes that are fixed for a unit keep their value across
  the levels of the other column. In mlmRev's Exam data, 269 of 322 shared
  student labels change sex across schools, whereas in a crossed
  psycholinguistic dataset none of 600 items changes its frequency or length
  (02-decisions.md, Q4). An attribute can show which column repeats its labels
  only when another attribute stays constant across the shared labels of the
  other column: in Exam, sex also changes within 35 of the 65 schools, so sex
  alone leaves the direction open, whereas the school attribute schgend,
  constant within every school, points to the student labels. The evidence
  informs a declaration and never decides the coding.
reads: [declaration, formula, grouping_factors, other_columns, predictors]
fitted_model: false
sample: design
scope: grouping_column_pair
applies_when: >-
  For the pair, the statistic declared of structure.label_incidence is none,
  its statistic composite is false and its relation is crossed or
  partially_crossed.
availability: []
statistics:
  labels_column:
    kind: names
    definition: >-
      The column whose repeated labels the evidence concerns. The check looks
      in both directions, each with one column of the pair as the labels
      column and the other as the context column, and computes the statistics
      below in each. It reports the only direction that has candidate
      attributes. When both have them, it reports the direction whose
      changing_labels is above 0 when that of the other is 0, since the other
      direction then has an attribute that stays constant across its shared
      labels, as an attribute of its units does, so that the change in the
      reported direction cannot come from the other column repeating its
      labels. Otherwise, and when neither direction has candidate attributes,
      it reports the direction whose labels column is the first column.
  context_column:
    kind: names
    definition: The other column of the pair in the reported direction.
  levels:
    kind: count
    count_class: by_unit
    resolved_by: [{source: statistic, name: labels_column}]
    measures: levels
    definition: >-
      The number of labels of the labels column in the rows of the design
      sample in which both columns are present, labels being compared by
      value (registry.md, Terms), which structure.label_incidence counts as
      levels_first or levels_second.
  shared_labels:
    kind: count
    count_class: by_unit
    resolved_by: [{source: statistic, name: labels_column}]
    part_of: levels
    definition: >-
      The number of labels of the labels column that occur with more than one
      label of the context column in the same rows, which
      structure.label_incidence counts as first_in_several or
      second_in_several, so that it is suppressed with them.
  attributes:
    kind: names
    definition: >-
      The candidate attributes, in code-point order of their names. They are
      the columns that the IR reads or that the declaration gives a role,
      other than the response, its trials column, the columns that the
      declaration gives the role outcome or outcome_derived and the two
      columns of the pair, so that sample columns enter only through a
      declared role, which, in the rows of the design sample in which both
      columns of the pair are present, are constant within most combinations
      of a label of the labels column and a label of the context column but
      not within every label of the context column. With agreement written as
      m / 10^d, a column is constant within most combinations when c times
      10^d is at least m times n in integer arithmetic, where n is the number
      of combinations that occur in these rows and c the number within which
      its values are all equal. Values are compared by value (registry.md,
      Terms), with missing values equal to each other.
  changing_labels:
    kind: count
    count_class: by_unit
    resolved_by: [{source: statistic, name: labels_column}]
    part_of: shared_labels
    definition: >-
      The smallest number, over the candidate attributes, of shared labels
      for which the attribute takes more than one value in the rows of the
      label in which both columns of the pair are present. Attributes of a
      single unit are the attributes that can stay constant across contexts,
      whereas an attribute of the combinations, such as a condition assigned
      to each subject and item, changes for most shared labels in both
      directions. It is absent when neither direction has a candidate
      attribute.
  changing_share:
    kind: ratio
    count_class: by_unit
    numerator: changing_labels
    denominator: shared_labels
    definition: changing_labels divided by shared_labels, absent when changing_labels is absent.
  changing_attribute:
    kind: names
    definition: >-
      The candidate attribute that gives changing_labels, the first in
      code-point order of their names on a tie. It is absent when neither
      direction has a candidate attribute.
  tied:
    kind: boolean
    definition: >-
      Whether both directions have candidate attributes and changing_labels
      above 0, so that every candidate attribute changes across the shared
      labels of both columns and the attributes cannot show which of the two
      columns repeats its labels, since a column that repeats its labels makes
      the attributes of its units change in both directions.
thresholds:
  most_change:
    statistic: changing_share
    comparator: '>='
    value: 0.5
    validation: {value: descriptive}
    rationale: >-
      When at least half of the shared labels change an attribute that is
      fixed for a unit, the labels most probably denote different units in
      different contexts, as in the Exam data.
    sources:
      - kind: convention
        citation: Set by this project for registry 0.1.0, to be replaced by a validated rule.
      - kind: decision
        citation: 02-decisions.md, Q4
  any_change:
    statistic: changing_labels
    comparator: '>='
    value: 1
    validation: {value: descriptive}
    rationale: >-
      One shared label whose fixed attribute changes shows that at least one
      repeated label does not denote a single unit with consistent data.
    sources:
      - kind: convention
        citation: Set by this project for registry 0.1.0.
parameters:
  agreement:
    value: 0.99
    definition: >-
      The share of the combinations of a label of the labels column and a
      label of the context column within which a column must be constant to
      count as a candidate attribute, so that one combination with two rows
      that disagree, as a data error or a label shared by two persons in one
      context, does not remove the attribute.
    sources:
      - kind: decision
        citation: >-
          02-decisions.md, Q4, where the same share infers the level at which a
          variable varies (registry.md, Terms).
      - kind: derivation
        citation: >-
          In mlmRev's Exam data, one combination of school and student holds a
          boy and a girl, so that exact constancy removes sex from the
          candidates. With this share, sex changes for 269 of the 322 shared
          student labels, as the evidence of
          docs/design/evidence/decisions/E-verify/scripts/exp_label_scope_evidence.R
          reports.
decision:
  rules:
    - finding: consistent
      condition: attributes is empty.
      statistics: [attributes]
      thresholds: []
      message: no_attribute
    - finding: consistent
      condition: tied is true.
      statistics: [tied]
      thresholds: []
      message: tied
    - finding: detectable_inconsequential
      condition: changing_share reaches most_change.
      statistics: [changing_share]
      thresholds: [most_change]
      message: reuse_likely
    - finding: detectable_inconsequential
      condition: changing_labels reaches any_change.
      statistics: [changing_labels]
      thresholds: [any_change]
      message: some_change
  otherwise:
    finding: consistent
    message: no_change
assessability:
  - value: not_assessable
    reason: prerequisite_unmet
    prerequisite: unit_attribute
    condition: attributes is empty.
messages:
  no_attribute:
    template: >-
      No column is constant within the units that the repeated labels of
      {labels_column} denote, so the data give no evidence on whether a label
      denotes one unit across the levels of {context_column}. Declare the scope
      of the labels.
    args:
      labels_column: {source: statistic, name: labels_column}
      context_column: {source: statistic, name: context_column}
  tied:
    template: >-
      Every candidate attribute changes across the shared labels of both
      {labels_column} and {context_column}, so the attributes cannot show which
      of the two columns repeats its labels. Declare the scope of the labels.
    args:
      labels_column: {source: statistic, name: labels_column}
      context_column: {source: statistic, name: context_column}
  reuse_likely:
    template: >-
      {labels_column} has {shared} occurring with several levels of
      {context_column}, and the attribute {attribute} changes between those
      levels for {share} of them, so these labels probably denote different
      units. The model treats each label as one unit. Declare the scope of the
      labels, and nest {labels_column} in {context_column} if the labels are
      reused.
    fallback: >-
      For at least half of the labels of {labels_column} that occur with
      several levels of {context_column}, the attribute {attribute} changes
      between those levels, so these labels probably denote different units.
      The model treats each label as one unit. Declare the scope of the labels,
      and nest {labels_column} in {context_column} if the labels are reused.
    args:
      share: {source: statistic, name: changing_share, digits: 0}
      shared: {source: statistic, name: shared_labels, noun: [label, labels]}
      labels_column: {source: statistic, name: labels_column}
      context_column: {source: statistic, name: context_column}
      attribute: {source: statistic, name: changing_attribute}
  some_change:
    template: >-
      {labels_column} has {shared} occurring with several levels of
      {context_column}, and the attribute {attribute} changes between those
      levels for {changing} of them. Check these units and declare the scope
      of the labels.
    fallback: >-
      For some of the labels of {labels_column} that occur with several levels
      of {context_column}, the attribute {attribute} changes between those
      levels. Check these units and declare the scope of the labels.
    args:
      changing: {source: statistic, name: changing_labels}
      shared: {source: statistic, name: shared_labels, noun: [label, labels]}
      labels_column: {source: statistic, name: labels_column}
      context_column: {source: statistic, name: context_column}
      attribute: {source: statistic, name: changing_attribute}
  no_change:
    template: >-
      {labels_column} has {shared} occurring with several levels of
      {context_column}, and none of the attributes changes for any of them,
      which is consistent with labels that each denote one unit. Attributes:
      {attributes}. Declare the scope of the labels to confirm it.
    fallback: >-
      No label of {labels_column} that occurs with several levels of
      {context_column} changes any of the attributes {attributes}, which is
      consistent with labels that each denote one unit. Declare the scope of
      the labels to confirm it.
    args:
      shared: {source: statistic, name: shared_labels, noun: [label, labels]}
      labels_column: {source: statistic, name: labels_column}
      context_column: {source: statistic, name: context_column}
      attributes: {source: statistic, name: attributes}
remedies:
  - id: declare_scope
    description: >-
      Declare the two units with nested_in and id_scope, or as a crossing, so
      that the relation no longer rests on the labels alone.
    uses_outcome: false
    changes_estimand: false
    software: []
  - id: nest_in_formula
    description: >-
      If the labels are reused within each level of the context column, write
      the random term with '/' so that the IR builds a grouping factor whose
      levels are unique across the data.
    uses_outcome: false
    changes_estimand: false
    software: []
links:
  requires: [structure.label_incidence]
  explained_by: []
references:
  - kind: decision
    citation: 02-decisions.md, Q4
catalogue: [L1-01, L7-01]
