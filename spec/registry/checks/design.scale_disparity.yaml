id: design.scale_disparity
version: 1
title: Scales of the fixed-effects columns
tier: T0
summary: >-
  Anticipates lme4's warning that predictors are on very different scales,
  which it gives with the default settings of lmerControl() when the standard
  deviations of the fixed-effects columns that it keeps and that are not all 0
  or 1 differ by a factor above 1000, or when one of them lies above 1000 or
  below 0.001. The warning concerns the units of the columns, so the check
  also reports the condition number of the fixed-effects matrix with columns
  scaled to unit length, which measures near-dependence between the columns
  and which a change of units does not alter. Columns coded from categorical
  predictors are left out of the standard deviations, because their contrasts
  lie between -1 and 1, so that they rarely set off the warning, and because
  their standard deviations give back the counts of the levels.
reads: [formula, predictors]
fitted_model: false
sample: design
scope: model
applies_when: >-
  The design sample has at least two rows, and scaled_columns is not empty.
availability: []
statistics:
  scaled_columns:
    kind: names
    definition: >-
      The fixed-effects columns, other than the intercept, that the sequential
      rule keeps, that belong to terms whose variables are all numeric and
      that take a value other than 0 and 1 in the design sample, in column
      order.
  sd_largest:
    kind: real
    definition: >-
      The largest standard deviation of those columns, with denominator n - 1,
      where n is the number of rows of the design sample. The standard
      deviation of a column whose values are all equal, compared by value, is
      0. That of any other column is M times the standard deviation of the
      column divided by its largest absolute value M, which keeps the squares
      from overflowing or underflowing, computed from its mean, summed exactly
      and divided once as ir.md (Centring) computes means, as the square root
      of the sum of the squared differences from the mean, summed exactly and
      rounded once in the same way, divided by n - 1. Every operation is then
      fixed, so that the two packages give the same double.
  sd_smallest:
    kind: real
    definition: The smallest of those standard deviations.
  sd_ratio:
    kind: real
    definition: sd_largest divided by sd_smallest, absent when sd_smallest is 0.
  condition_number:
    kind: real
    definition: >-
      The ratio of the largest to the smallest singular value of the matrix of
      the fixed-effects columns that the sequential rule keeps, the intercept
      included, each divided by its largest absolute value and then scaled to
      unit Euclidean length. The singular values are those of that matrix
      itself, computed by a backward-stable singular value decomposition such
      as LAPACK's, through svd() in R and numpy.linalg.svd in Python, never
      the square roots of the eigenvalues of its cross-product, whose error
      grows with the square of the condition number. The relative error of
      the smallest singular value then grows with the condition number, so
      the two packages compare it within a tolerance that grows with its
      value (conventions.md, Comparison across languages).
thresholds:
  ratio:
    statistic: sd_ratio
    comparator: '>'
    value: 1000
    proximity: {relative: 0.000000001, absolute: 0.000000000001}
    validation: {value: descriptive}
    rationale: The ratio of standard deviations above which lme4 warns.
    sources:
      - kind: software
        citation: >-
          lme4 2.1-0, the CRAN release of 23 October 2026: the function
          checkScaleX() in R/utilities.R, the check of the scales of the
          fixed-effects columns that the check.scaleX setting of lmerControl()
          controls.
        doi: 10.32614/CRAN.package.lme4
        url: https://CRAN.R-project.org/package=lme4
        full_text_read: true
  high:
    statistic: sd_largest
    comparator: '>'
    value: 1000
    proximity: {relative: 0.000000001, absolute: 0.000000000001}
    validation: {value: descriptive}
    rationale: The standard deviation above which lme4 warns.
    sources:
      - kind: software
        citation: >-
          lme4 2.1-0, the CRAN release of 23 October 2026: the function
          checkScaleX() in R/utilities.R, the check of the scales of the
          fixed-effects columns that the check.scaleX setting of lmerControl()
          controls.
        doi: 10.32614/CRAN.package.lme4
        url: https://CRAN.R-project.org/package=lme4
        full_text_read: true
  low:
    statistic: sd_smallest
    comparator: '<'
    value: 0.001
    proximity: {relative: 0.000000001, absolute: 0.000000000001}
    validation: {value: descriptive}
    rationale: The standard deviation below which lme4 warns.
    sources:
      - kind: software
        citation: >-
          lme4 2.1-0, the CRAN release of 23 October 2026: the function
          checkScaleX() in R/utilities.R, the check of the scales of the
          fixed-effects columns that the check.scaleX setting of lmerControl()
          controls.
        doi: 10.32614/CRAN.package.lme4
        url: https://CRAN.R-project.org/package=lme4
        full_text_read: true
parameters: {}
decision:
  rules:
    - finding: detectable_inconsequential
      condition: sd_ratio exceeds ratio, sd_largest exceeds high or sd_smallest is below low.
      statistics: [sd_ratio, sd_largest, sd_smallest]
      thresholds: [ratio, high, low]
      message: disparate
  otherwise:
    finding: consistent
    message: similar
assessability: []
messages:
  disparate:
    template: >-
      The standard deviations of {columns} differ by a factor of {ratio}, or
      one of them lies outside 0.001 to 1000, which makes lme4 warn that the
      predictors are on very different scales. Centre and scale these columns
      outside the formula with stored constants.
    fallback: >-
      The standard deviations of {columns} differ by a factor above 1000, or
      one of them lies outside 0.001 to 1000, which makes lme4 warn that the
      predictors are on very different scales. Centre and scale these columns
      outside the formula with stored constants.
    args:
      columns: {source: statistic, name: scaled_columns}
      ratio: {source: statistic, name: sd_ratio, digits: 0}
  similar:
    template: >-
      Each standard deviation of {columns} lies between 0.001 and 1000, and the
      largest is {ratio} times the smallest at most.
    fallback: >-
      Each standard deviation of {columns} lies between 0.001 and 1000, and the
      largest is at most 1000 times the smallest.
    args:
      columns: {source: statistic, name: scaled_columns}
      ratio: {source: statistic, name: sd_ratio, digits: 1}
remedies:
  - id: rescale
    description: >-
      Centre and scale the columns outside the formula with stored constants,
      and report coefficients transformed back to the original units.
    uses_outcome: false
    changes_estimand: false
    software: []
links:
  requires: []
  explained_by: []
references:
  - kind: derivation
    citation: Review catalogue (docs/design/evidence/review-catalogue.md), L2-13 and L4-06.
catalogue: [L2-13, L4-06]
