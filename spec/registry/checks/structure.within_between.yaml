id: structure.within_between
version: 1
title: Within and between status of a fixed term
tier: T0
summary: >-
  For each fixed term other than the intercept and each grouping factor,
  reports whether the term varies within the levels of the factor, how many
  levels inform a slope for it and, for a single numeric column, its
  intraclass correlation. Whether a term varies within a level is inferred
  with the tolerance of 02-decisions.md (Q4), so that a few miscoded rows do
  not turn a term that is constant within levels into one that varies, and
  the messages say that the status was inferred from the data. A by-factor slope for a term that does not vary
  within any level only describes how the variance between levels changes with
  the term. Whether such a variance is identified depends on the coding and on
  the number of distinct values, and it is never a slope variance.
reads: [formula, grouping_factors, predictors]
fitted_model: false
sample: design
scope: fixed_term_by_factor
availability: []
statistics:
  multi_row_levels:
    kind: count
    count_class: by_unit
    definition: The number of levels of the factor with at least two rows in the design sample.
  varying_levels:
    kind: count
    count_class: by_unit
    definition: >-
      The number of levels with at least two rows in which the term varies. A
      level is constant in the term when its most frequent row pattern, the
      values of the term's columns in a row compared exactly, covers at least
      the share agreement of its rows: with agreement written as m / 10^d, c
      rows of that pattern and n rows in the level, when c times 10^d is at
      least m times n in integer arithmetic. A level varies otherwise.
  informative_levels:
    kind: count
    count_class: by_unit
    definition: >-
      The number of levels counted in varying_levels in which the rank by the
      sequential rule of the term's columns, restricted to the level's rows,
      after the level's first row is subtracted from every row, equals the
      number of columns of the term.
  status:
    kind: category
    values: [between, within, partially_within]
    definition: >-
      between when varying_levels is 0, so that every level with at least two
      rows is constant in the term, within when varying_levels equals
      multi_row_levels and is above 0, and partially_within otherwise.
  slope_requested:
    kind: boolean
    definition: >-
      Whether a random term of the IR with this grouping factor has a term
      whose set of variables equals that of this fixed term, as estimands are
      matched with terms (declarations.md, estimands).
  icc:
    kind: real
    definition: >-
      For a term with one column that is not coded from a factor, the ANOVA
      intraclass correlation of the column across the levels, (MSB - MSW) /
      (MSB + (n0 - 1) MSW), with MSB = SSB/(J - 1), MSW = SSW/(N - J), SSB the
      sum over levels of the level size times the squared difference between
      the level mean and the overall mean, SSW the sum of squared differences
      from the level means and n0 as structure.cluster_sizes defines it. It is
      absent for other terms, when J is 1, when N equals J or when the
      denominator is 0.
  within_share:
    kind: real
    definition: >-
      For the same terms, SSW / (SSB + SSW), the share of the column's variation
      that lies within levels, absent when SSB + SSW is 0 or for other terms.
thresholds: {}
parameters:
  agreement:
    value: 0.99
    definition: >-
      The share of a level's rows that its most frequent row pattern must
      cover for the level to count as constant in the term.
    sources:
      - kind: decision
        citation: >-
          02-decisions.md, Q4. A rule that required 99% agreement within
          clusters recovered the school level in 99.3 to 100% of 2,000
          replicates with up to 0.5% of rows miscoded.
decision:
  rules:
    - finding: consequential
      condition: status is between and slope_requested is true.
      thresholds: []
      message: between_slope
    - finding: detectable_inconsequential
      condition: status is partially_within and slope_requested is true.
      thresholds: []
      message: partial_slope
  otherwise:
    finding: consistent
    message: status
assessability: []
messages:
  between_slope:
    template: >-
      As inferred from the data, '{term}' does not vary within any level of
      '{factor}', so a by-'{factor}' slope for it can only describe how the
      variance between levels changes with '{term}'. Its variance is not a
      slope variance and may not be identified. Remove the slope, or keep it only as a model of
      between-level variance.
    args:
      term: {source: scope, name: term}
      factor: {source: scope, name: factor}
  partial_slope:
    template: >-
      As inferred from the data, '{term}' varies within {varying} of the
      {levels} levels of '{factor}' that have two or more rows, and in all its
      columns within {informative}, so its by-'{factor}' slope rests on those
      levels alone.
    args:
      term: {source: scope, name: term}
      factor: {source: scope, name: factor}
      varying: {source: statistic, name: varying_levels}
      levels: {source: statistic, name: multi_row_levels}
      informative: {source: statistic, name: informative_levels}
  status:
    template: >-
      As inferred from the data, '{term}' is {status} with respect to
      '{factor}': it varies within {varying} of the {levels} levels that have
      two or more rows.
    args:
      term: {source: scope, name: term}
      factor: {source: scope, name: factor}
      status: {source: statistic, name: status}
      varying: {source: statistic, name: varying_levels}
      levels: {source: statistic, name: multi_row_levels}
remedies:
  - id: remove_slope
    description: >-
      Remove the by-factor slope of a term that does not vary within the
      factor's levels, and model differences in variance between levels
      explicitly if they matter.
    uses_outcome: false
    changes_estimand: false
    software: []
  - id: decompose
    description: >-
      Separate the within-level and between-level parts of a numeric
      predictor: add its level means over the design sample and the deviations
      from them as columns declared with derived_from, and use both as
      predictors.
    uses_outcome: false
    changes_estimand: true
    software: []
links:
  requires: []
  explained_by: [sample.raw_vs_analysis]
references:
  - kind: derivation
    citation: >-
      Review catalogue (docs/design/evidence/review-catalogue.md), L1-03, with
      the verifier's correction on coding and on the number of distinct values.
catalogue: [L1-03, L1-04, L1-11, L7-07]
