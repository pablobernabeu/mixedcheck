id: assignment.design_df
version: 1
title: Design degrees of freedom of an assignment
tier: T0
summary: >-
  For a variable assigned between units, counts the degrees of freedom between
  the levels of the assignment unit that remain after the fixed effects, the
  number of assigned units minus the unit-level fixed parameters computed by
  rank. The information on an effect assigned to units grows with this number
  rather than with the number of rows. The check also names declared blocking
  units that the formula leaves out, since blocking factors used in the
  assignment belong in the fixed part.
reads: [declaration, formula, grouping_factors, predictors]
fitted_model: false
sample: design
scope: assignment
applies_when: >-
  The assignment's level is between_unit, declared or inferred (registry.md,
  Terms), and some level of the unit has at least two rows in the design
  sample.
availability:
  - reason: declaration_missing
    condition: The declaration has no assignment block.
    pointer: /assignment
statistics:
  units:
    kind: count
    count_class: by_unit
    definition: The number of levels of the assignment unit in the design sample.
  design_df:
    kind: count
    count_class: non_person
    definition: >-
      The number of indicator columns of the levels of the unit, in level
      order, that the sequential rule keeps when it is applied to the
      fixed-effects columns followed by the indicator columns.
  missing_blocks:
    kind: names
    definition: >-
      The declared blocks of the assignment whose label columns appear neither
      in the fixed part nor in a grouping factor of the IR, in declared order.
  level_source:
    kind: category
    values: [declared, inferred_from_the_data]
    definition: >-
      declared when the assignment declares its level, and
      inferred_from_the_data when its level is inferred (registry.md, Terms).
thresholds: {}
parameters:
  agreement:
    value: 0.99
    definition: >-
      The share of a level's rows that the most frequent value of the assigned
      column must cover for the level to count as constant, when the level of
      the assignment is inferred (registry.md, Terms).
    sources:
      - kind: decision
        citation: >-
          02-decisions.md, Q4. A rule that required 99% agreement within
          clusters recovered the school level in 99.3 to 100% of 2,000
          replicates with up to 0.5% of rows miscoded.
decision:
  rules:
    - finding: consequential
      condition: design_df is 0.
      thresholds: []
      message: no_df
    - finding: detectable_inconsequential
      condition: missing_blocks is not empty.
      thresholds: []
      message: blocks_missing
  otherwise:
    finding: consistent
    message: design_df
assessability: []
messages:
  no_df:
    template: >-
      No degrees of freedom remain between the {units} levels of '{unit}', the
      unit to which '{column}' was assigned at a level between units that is
      {level}, after the fixed effects, so the effect of '{column}' cannot be
      compared with variation between units.
    args:
      units: {source: statistic, name: units}
      unit: {source: scope, name: unit}
      column: {source: scope, name: column}
      level: {source: statistic, name: level_source}
  blocks_missing:
    template: >-
      The assignment of '{column}' was blocked by {blocks}, which the formula
      does not include. '{unit}', to which '{column}' was assigned at a level
      between units that is {level}, leaves {df} degrees of freedom between
      its {units} levels after the fixed effects.
    args:
      column: {source: scope, name: column}
      blocks: {source: statistic, name: missing_blocks}
      unit: {source: scope, name: unit}
      df: {source: statistic, name: design_df}
      units: {source: statistic, name: units}
      level: {source: statistic, name: level_source}
  design_df:
    template: >-
      '{unit}', the unit to which '{column}' was assigned at a level between
      units that is {level}, has {units} levels and leaves {df} degrees of
      freedom between them after the fixed effects.
    args:
      unit: {source: scope, name: unit}
      column: {source: scope, name: column}
      units: {source: statistic, name: units}
      df: {source: statistic, name: design_df}
      level: {source: statistic, name: level_source}
remedies:
  - id: add_blocks
    description: Add the blocking factors of the assignment to the fixed part.
    uses_outcome: false
    changes_estimand: false
    software: []
links:
  requires: []
  explained_by: [assignment.constant_within_unit]
references:
  - kind: derivation
    citation: Review catalogue (docs/design/evidence/review-catalogue.md), L7-03 and L7-04.
catalogue: [L7-03, L7-04]
